name: wiki-sync

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push docs/wiki to the GitHub wiki repo
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" "$WORK/wiki" 2>/dev/null || {
            echo "Wiki repo not initialized yet — creating it"
            mkdir -p "$WORK/wiki"
            cd "$WORK/wiki"
            git init -b master
          }
          cd "$WORK/wiki"
          rsync -a --delete --exclude='.git' "$GITHUB_WORKSPACE/docs/wiki/" ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date"
            exit 0
          fi
          git commit -m "docs(wiki): sync from docs/wiki @ ${{ github.sha }}"
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git"
          git push -u origin HEAD:master --force-with-lease
