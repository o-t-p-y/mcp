name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Secrets scan
        run: |
          git grep -InE "(KAVENEGAR_API_KEY|JWT_SECRET|BARADARZADEH_PROJECT_KEY)\s*=\s*['\"]?[A-Za-z0-9]{16,}" -- ':!*.example' ':!docs/**' ':!AGENTS.md' && exit 1 || exit 0
